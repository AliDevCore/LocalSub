name: Build & Release LocalSub (Windows x64)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Standalone Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version and Tag
        id: get_version
        shell: pwsh
        run: |
          # Read version from pyproject.toml
          $content = Get-Content "pyproject.toml" -Raw
          if ($content -match 'version\s*=\s*"([^"]+)"') {
            $baseVer = $matches[1]
          } else {
            $baseVer = "1.0.0"
          }
          
          # If triggered by a git tag, use that exact tag
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF -replace "refs/tags/", ""
            $ver = $tag -replace "^v", ""
          } else {
            # Triggered by push to main branch
            # Check if tag v$baseVer exists locally or on remote
            git fetch --tags --force
            $existingTag = git tag -l "v$baseVer"
            if ($existingTag) {
              # If tag exists, generate unique release tag with GitHub run number
              $tag = "v$baseVer.$env:GITHUB_RUN_NUMBER"
              $ver = "$baseVer.$env:GITHUB_RUN_NUMBER"
            } else {
              $tag = "v$baseVer"
              $ver = $baseVer
            }
          }
          
          Write-Host "Resolved Version: $ver, Target Tag: $tag"
          "version=$ver" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
        id: setup-ffmpeg

      - name: Copy FFmpeg to project bin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "bin" -Force | Out-Null
          $ffmpegPath = (Get-Command ffmpeg).Source
          Write-Host "Discovered FFmpeg at: $ffmpegPath"
          Copy-Item $ffmpegPath -Destination "bin\ffmpeg.exe" -Force
          Get-Item "bin\ffmpeg.exe"

      - name: Install Python Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Run Test Suite
        shell: pwsh
        run: |
          python -m pytest -v

      - name: Build Standalone Windows Executable & ZIP
        shell: pwsh
        run: |
          python packaging/build_windows.py

      - name: Smoke Test Compiled Binary
        shell: pwsh
        run: |
          $exe = "dist\LocalSub\LocalSub.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "LocalSub.exe was not created in dist/LocalSub/"
            exit 1
          }
          Write-Host "Executing smoke self-test on standalone binary..."
          $proc = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru -NoNewWindow
          Write-Host "Smoke test process finished with exit code: $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) {
            Write-Error "Smoke test failed on compiled binary with code $($proc.ExitCode)"
            exit 1
          }
          Write-Host "Smoke test passed successfully!"

      - name: Verify Build Artifacts
        shell: pwsh
        run: |
          $zip = Get-ChildItem "dist\LocalSub-*-windows-x64.zip"
          if (-not $zip) {
            Write-Error "Release ZIP was not found in dist/"
            exit 1
          }
          Write-Host "Found release archive: $($zip.FullName) ($([math]::Round($zip.Length / 1MB, 2)) MB)"
          Get-Content "dist\$($zip.Name).sha256"

      - name: Upload Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: LocalSub-Windows-x64
          path: |
            dist/LocalSub-*-windows-x64.zip
            dist/LocalSub-*-windows-x64.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: LocalSub ${{ steps.get_version.outputs.tag }}
          files: |
            dist/LocalSub-*-windows-x64.zip
            dist/LocalSub-*-windows-x64.zip.sha256
          make_latest: true
          body: |
            <div dir="rtl">

            ## انتشار نگارش جدید لوکال‌ساب (LocalSub ${{ steps.get_version.outputs.tag }})
            
            نرم‌افزار مستقل و هوشمند استخراج و ترجمه کاملاً محلی زیرنویس ویدیویی برای ویندوز ۱۰ و ۱۱

            ### 🚀 راهنمای دانلود و اجرای سریع (بدون نیاز به نصب):
            1. فایل فشرده پیوست شده در بخش Assets با نام `LocalSub-${{ steps.get_version.outputs.tag }}-windows-x64.zip` را دانلود کنید.
            2. بر روی فایل دانلود شده کلیک راست کرده و گزینه **Extract All** را انتخاب کنید.
            3. وارد پوشه شده و فایل **`LocalSub.exe`** را با دابل‌کلیک اجرا کنید.

            > 💡 **ویژگی مهم:** این نرم‌افزار کاملاً پرتابل (قابل حمل) و مستقل است. برای اجرای آن به هیچ‌گونه نصب پایتون، درایور، کتابخانه‌های جانبی یا کارت گرافیک اختصاصی نیازی ندارید و تمامی پردازش‌ها به‌صورت ۱۰۰٪ آفلاین بر روی پردازنده معمولی (CPU) شما اجرا می‌شوند.

            ---

            ### 🔐 بررسی اصالت و سلامت بسته اجرایی (SHA-256 Checksum):
            کد هش اعتبارسنجی فایل فشرده در فایل پیوست `LocalSub-${{ steps.get_version.outputs.tag }}-windows-x64.zip.sha256` قرار دارد که می‌توانید پیش از اجرا، سلامت کامل فایل دانلود شده را با آن تایید نمایید.

            </div>
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
